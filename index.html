<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الموقع قيد التطوير</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% 0%,
            #850000 0%,
            #350000 38%,
            #050505 85%
        );

    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* الإضاءة */

body::before,
body::after{
    content:"";
    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    background:rgba(255,0,0,.16);

    filter:blur(110px);

    z-index:-2;

    animation:lightMove 8s infinite alternate;
}

body::before{
    top:-180px;
    right:-120px;
}

body::after{
    bottom:-180px;
    left:-120px;

    animation-delay:2s;
}

@keyframes lightMove{

    from{
        transform:translate(0,0) scale(.8);
    }

    to{
        transform:translate(70px,70px) scale(1.2);
    }

}

/* الجزيئات */

.particles{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-1;
}

.particle{
    position:absolute;

    bottom:-20px;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#ff3030;

    box-shadow:
        0 0 10px #ff0000,
        0 0 20px #ff0000;

    animation:particleUp linear infinite;
}

@keyframes particleUp{

    0%{
        transform:translateY(0);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    85%{
        opacity:.8;
    }

    100%{
        transform:translateY(-110vh);
        opacity:0;
    }

}

/* الكارت */

.maintenance{

    width:calc(100% - 30px);

    max-width:570px;

    padding:45px 28px;

    text-align:center;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(55,0,0,.94),
            rgba(12,0,0,.97)
        );

    border:1px solid rgba(255,50,50,.28);

    box-shadow:
        0 0 80px rgba(255,0,0,.22),
        inset 0 0 50px rgba(255,0,0,.04);

    position:relative;

    overflow:hidden;

}

/* خط الإضاءة المتحرك */

.maintenance::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff3030,
            transparent
        );

    animation:scan 4s infinite;

}

@keyframes scan{

    0%{
        left:-100%;
    }

    50%,100%{
        left:140%;
    }

}

/* الأيقونة */

.icon{

    width:95px;
    height:95px;

    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:43px;

    background:
        radial-gradient(
            circle,
            #8d0000,
            #280000
        );

    border:1px solid rgba(255,70,70,.4);

    box-shadow:
        0 0 30px rgba(255,0,0,.3),
        inset 0 0 25px rgba(255,0,0,.2);

    animation:pulse 2s infinite;

}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
        box-shadow:
            0 0 30px rgba(255,0,0,.25),
            inset 0 0 25px rgba(255,0,0,.15);
    }

    50%{
        transform:scale(1.06);
        box-shadow:
            0 0 50px rgba(255,0,0,.45),
            inset 0 0 35px rgba(255,0,0,.25);
    }

}

/* العنوان */

h1{

    font-size:32px;

    margin-bottom:15px;

    text-shadow:
        0 0 20px rgba(255,0,0,.35);

}

/* النص */

.description{

    color:#d7baba;

    font-size:16px;

    line-height:2;

    margin-bottom:25px;

}

/* الحالة */

.status{

    display:inline-flex;

    align-items:center;

    gap:9px;

    padding:11px 18px;

    border-radius:30px;

    background:rgba(120,0,0,.35);

    border:1px solid rgba(255,50,50,.2);

    color:#ff8585;

    font-size:14px;

    margin-bottom:25px;

}

.status-dot{

    width:9px;
    height:9px;

    border-radius:50%;

    background:#ff3838;

    box-shadow:0 0 12px #ff0000;

    animation:blink 1.2s infinite;

}

@keyframes blink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.35;
    }

}

/* الفاصل */

.line{

    width:80%;

    height:1px;

    margin:5px auto 25px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,50,50,.35),
            transparent
        );

}

/* وقت العودة */

.back{

    color:#a98c8c;

    font-size:13px;

    line-height:1.9;

}

/* زر */

button{

    margin-top:25px;

    border:0;

    padding:14px 28px;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #ff2929,
            #850000
        );

    color:#fff;

    font-family:inherit;

    font-weight:bold;

    font-size:15px;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(255,0,0,.2);

    transition:.3s;

}

button:hover{

    transform:translateY(-3px);

    box-shadow:
        0 12px 35px rgba(255,0,0,.4);

}

/* الحقوق */

footer{

    margin-top:28px;

    color:#654e4e;

    font-size:12px;

}

/* الهاتف */

@media(max-width:600px){

    .maintenance{

        padding:38px 20px;

        border-radius:25px;

    }

    .icon{

        width:82px;
        height:82px;

        font-size:37px;

    }

    h1{

        font-size:26px;

    }

    .description{

        font-size:14px;

    }

}

</style>

</head>

<body>


<!-- الجزيئات -->

<div class="particles">

    <span class="particle"
    style="left:5%;animation-duration:8s"></span>

    <span class="particle"
    style="left:15%;animation-duration:11s"></span>

    <span class="particle"
    style="left:27%;animation-duration:9s"></span>

    <span class="particle"
    style="left:40%;animation-duration:13s"></span>

    <span class="particle"
    style="left:55%;animation-duration:10s"></span>

    <span class="particle"
    style="left:68%;animation-duration:12s"></span>

    <span class="particle"
    style="left:82%;animation-duration:9s"></span>

    <span class="particle"
    style="left:94%;animation-duration:11s"></span>

</div>


<!-- صفحة الصيانة -->

<div class="maintenance">

    <div class="icon">
        🔧
    </div>

    <h1>
        الموقع قيد التطوير
    </h1>

    <p class="description">

        نعمل حاليًا على تطوير الموقع وتحسين
        الأداء وإضافة بعض المميزات الجديدة.

        <br>

        نعتذر عن الإزعاج، وسنعود للعمل قريبًا.

    </p>


    <div class="status">

        <span class="status-dot"></span>

        جاري العمل على الموقع

    </div>


    <div class="line"></div>


    <p class="back">

        يرجى المحاولة مرة أخرى لاحقًا.

        <br>

        شكرًا لزيارتك ❤️

    </p>


    <button onclick="location.reload()">

        🔄 إعادة المحاولة

    </button>


    <footer>

        جميع الحقوق محفوظة © 2026

    </footer>

</div>


</body>
</html>
